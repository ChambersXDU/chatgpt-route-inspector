<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="options.documentTitle">Route Inspector · 设置</title><link rel="stylesheet" href="../shared/styles.css"></head>
<body><div class="shell options-shell">
  <header class="masthead"><div class="brand"><span class="brand-mark"></span><div class="brand-copy"><div class="brand-title-line"><h1 data-i18n="app.name">Route Inspector</h1><a class="author-link" href="https://blog.liu-qi.cn/tools/" target="_blank" rel="noopener noreferrer" data-i18n="app.author">Created by @liuqi</a></div><p data-i18n="options.subtitle">本地设置与数据管理</p></div></div><div class="masthead-controls"><div class="language-switch" role="group" aria-label="切换语言" data-i18n-aria-label="language.label"><button type="button" data-language="en" aria-pressed="false">EN</button><button type="button" data-language="zh" aria-pressed="true">中</button></div><span class="signal-pill live" data-i18n="options.localConfig">仅本地</span></div></header>
  <section class="page-title"><div><h2 data-i18n="options.title">设置与隐私</h2></div></section>
  <article class="panel"><header class="panel-head"><h3 data-i18n="options.general">常规</h3></header><div class="panel-body">
    <div class="switch-row"><div class="switch-copy"><b data-i18n="options.auto">自动监听</b></div><input id="auto" class="switch" type="checkbox"></div>
    <div class="form-grid" style="margin-top:16px"><div class="field"><label for="retention" data-i18n="options.retention">记录上限</label><input id="retention" type="number" min="10" max="500" step="10"></div><div class="field"><label for="ids" data-i18n="options.requestIds">导出请求 ID</label><select id="ids"><option value="false" data-i18n="options.redacted">默认脱敏</option><option value="true" data-i18n="options.fullIds">保留完整 ID</option></select></div></div>
    <div class="toolbar" style="margin-top:18px"><button id="save" class="button primary" data-i18n="options.save">保存设置</button><button id="clear" class="button danger" data-i18n="options.clear">清空本地记录</button></div>
  </div></article>
  <div class="notice" style="margin-top:16px" data-i18n="options.notice">路由记录仅保存在本机；导出时请求 ID 默认脱敏。</div><div class="toast" id="toast"></div>
</div><script src="index.js"></script></body></html>
