<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Route Inspector</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="../shared/clean.css">
</head>
<body class="popup-shell">
  <header class="masthead">
    <div class="brand">
      <span class="brand-mark"></span>
      <div class="brand-copy">
        <div class="brand-title-line"><h1>Route Inspector</h1></div>
        <p>当前实际路由模型</p>
      </div>
    </div>
    <span id="capture-status" class="signal-pill live">自动识别</span>
  </header>

  <main class="popup-content simple-popup">
    <section class="current-card" aria-live="polite">
      <div class="current-label">当前路由模型</div>
      <div id="current-model" class="current-model">正在读取…</div>
      <div id="current-meta" class="current-meta">刷新对话或发送一条消息后会自动更新</div>
    </section>

    <details class="advanced-disclosure" id="advanced">
      <summary>高级信息</summary>
      <div id="advanced-content" class="advanced-content"></div>
    </details>

    <div class="popup-actions">
      <button class="button" id="options" type="button">设置</button>
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
